<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zofportal - Contacto</title>

    <style>
        /* 1. ESTILO GENERAL */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url("img/hdhjsjdj.png");
            background-size: cover;
            background-attachment: fixed;
            background-color: #000000;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        /* 2. CONTENEDOR PRINCIPAL (Controla el ancho de la página) */
        .contenedor {
            max-width: 900px; /* Evita que los bloques sean gigantes */
            width: 90%;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 3. ENCABEZADO */
        .encabezado {
            text-align: center;
            margin-bottom: 20px;
        }

        .encabezado h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 0px 0px 15px rgba(255,255,255,0.3);
        }

        .encabezado p {
            font-size: 1.2rem;
            font-style: italic;
            color: #cccccc;
        }

        /* 4. BOTONES / LINKS */
        .enlaces {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .boton {
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .boton:hover {
            background: white;
            color: black;
            transform: translateY(-2px);
        }

        /* 5. BLOQUES DE OBRA */
        .bloque {
            background-color: rgba(39, 35, 28, 0.8); /* Un poco de transparencia */
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
            width: fit-content;
            margin: 20px auto;
        
        }

        .bloque img {
            /* Hacerla cuadrada */
            width: 300px;           /* Puedes ajustar este tamaño a tu gusto */
            height: 300px;          /* Debe ser igual al ancho */
            aspect-ratio: 1 / 1;    /* Fuerza la relación de aspecto cuadrada */
            object-fit: cover;      /* Recorta la imagen para que llene el cuadrado sin estirarse */
            
            /* Centrado y estilo */
            border-radius: 12px;    /* Bordes suavizados */
            margin-bottom: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            align-items: center;
        }

        .bloque:hover {
            border-color: rgba(255,255,255,0.3);
        }


        .bloque h2 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: #f0f0f0;
            border-left: 3px solid #fff;
            padding-left: 15px;
        }

        .bloque p {
            line-height: 1.6;
            color: #dddddd;
            margin: 5px 0;
            font-size: 1rem;
        }

        .especificaciones {
            font-family: monospace;
            font-size: 0.85rem !important;
            color: #888 !important;
            margin-top: 10px !important;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <header class="encabezado">
            <h1>Contacto</h1>
            <p>Proyección audiovisual inmersiva</p>
        </header>

        <nav class="enlaces">
            <a href="index.html" class="boton">Página principal</a>
            <a href="indice de obras.html" class="boton">Indice de obras</a>
        </nav>

       <article class="bloque">
            <img src="img/IMG_9342 (2).jpeg" alt="Imagen de contacto">
            <h2>Contacto</h2>
            <p>Contáctame a través de los siguientes medios:</p>
            <p><strong>Instagram:</strong> @soflvsminho</p>

            <a href="https://www.instagram.com/soflvsminho?igsh=MTVzaTY2MWVqd2o3bw%3D%3D&utm_source=qr" 
               target="_blank" 
               class="boton">
               Ir al perfil
            </a>
        </article>

    </div> </body>
</html>
