<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zofportal</title>
    <style>
        /* 1. RESET Y BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Evita que aparezcan barras de scroll */
            color: white;
        }

        /* 2. VIDEO DE FONDO */
        #video-fondo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que el video cubra toda la pantalla sin deformarse */
            z-index: -1; /* Lo manda al fondo */
            filter: brightness(0.6); /* Oscurece un poco el video para que el texto resalte */
        }

        /* 3. CONTENEDOR PRINCIPAL */
        .contenido-central {
            text-align: center;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* 4. BOTONES / LINKS */
        .enlaces {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .boton {
            text-decoration: none;
            color: white;
            border: 2px solid white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 5px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px); /* Efecto de vidrio esmerilado */
        }

        .boton:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="video-fondo">
        <source src="videos/Ensayo de un cosmos.mp4" type="video/mp4">
        Tu navegador no soporta videos.
    </video>

    <div class="contenido-central">
        <h1>Zofportal</h1>
        
        <div class="enlaces">
            <a href="Indice de obras.html" class="boton">Obras</a>
            <a href="contacto.html" class="boton">Contacto</a>
        </div>
    </div>

</body>
</html>
